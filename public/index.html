<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Firebase Hosting</title>

  <script defer src="/__/firebase/12.19.0/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/12.19.0/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/12.19.0/firebase-functions-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  <style media="screen">
  </style>
</head>

<body>
  <div id="message">
    <input type="text" id="emailInput">
    <input type="password" id="passwordInput">
    <button id="createUserButton">Create User</button>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        try {
          let app = firebase.app();
          let features = [
            'auth',
            'functions',
          ].filter(feature => typeof app[feature] === 'function');
        } catch (e) {
          console.error(e);
        }

        const email = document.getElementById('emailInput');
        const password = document.getElementById('passwordInput');
        const button = document.getElementById('createUserButton');

        button.addEventListener('click', () => {
          console.log("clikck")
          firebase.auth().createUserWithEmailAndPassword(email.value, password.value);
        });
      });
    </script>
</body>

</html>
